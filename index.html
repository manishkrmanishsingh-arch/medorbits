<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MedOrbit provides personalised admission guidance for MBBS in India and abroad, BDS, Nursing, Pharmacy, Engineering, MBA and career-focused programmes."
  >

  <meta
    name="keywords"
    content="MedOrbit, MBBS admission, MBBS abroad, medical counselling, education consultancy, career counselling, study abroad"
  >

  <title>MedOrbit | Education, Admission & Career Guidance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #0957d0;
      --primary-dark: #063d96;
      --primary-light: #eaf2ff;
      --secondary: #05a99d;
      --accent: #ffbd24;
      --dark: #071a2f;
      --dark-soft: #102943;
      --text: #172033;
      --muted: #667085;
      --white: #ffffff;
      --background: #f5f8fc;
      --border: #e3eaf3;
      --success: #18a957;
      --shadow-sm: 0 12px 32px rgba(7, 26, 47, 0.08);
      --shadow-lg: 0 28px 80px rgba(7, 26, 47, 0.16);
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 32px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-soft {
      background: var(--background);
    }

    .section-dark {
      background: var(--dark);
      color: var(--white);
    }

    .section-heading {
      max-width: 760px;
      margin: 0 auto 48px;
      text-align: center;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .section-label::before {
      content: "";
      width: 30px;
      height: 2px;
      border-radius: 20px;
      background: var(--accent);
    }

    .section-heading h2 {
      margin-bottom: 16px;
      color: var(--dark);
      font: 800 clamp(32px, 4vw, 54px) / 1.14 "Poppins", sans-serif;
      letter-spacing: -0.035em;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 17px;
    }

    .topbar {
      position: relative;
      z-index: 1001;
      background: var(--dark);
      color: #d5e1ee;
      font-size: 13px;
    }

    .topbar-content {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .topbar-message {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .topbar-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #48d597;
      box-shadow: 0 0 0 5px rgba(72, 213, 151, 0.12);
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .topbar-links a {
      transition: 0.2s ease;
    }

    .topbar-links a:hover {
      color: var(--white);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(227, 234, 243, 0.9);
      backdrop-filter: blur(18px);
    }

    .navbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-symbol {
      position: relative;
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 16px;
      color: var(--white);
      background: linear-gradient(145deg, var(--primary), #378cff);
      box-shadow: 0 14px 32px rgba(9, 87, 208, 0.28);
      font: 800 22px "Poppins", sans-serif;
    }

    .brand-symbol::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 32px;
      top: -14px;
      right: -10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-copy strong {
      color: var(--dark);
      font: 800 23px "Poppins", sans-serif;
      letter-spacing: -0.03em;
    }

    .brand-copy strong span {
      color: var(--primary);
    }

    .brand-copy small {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links > a {
      position: relative;
      padding: 10px 0;
      transition: 0.25s ease;
    }

    .nav-links > a:not(.nav-button)::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 4px;
      width: 0;
      height: 2px;
      border-radius: 10px;
      background: var(--primary);
      transition: 0.25s ease;
    }

    .nav-links > a:hover {
      color: var(--primary);
    }

    .nav-links > a:hover::after {
      width: 100%;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px !important;
      border-radius: 13px;
      background: var(--primary);
      color: var(--white) !important;
      box-shadow: 0 12px 26px rgba(9, 87, 208, 0.23);
    }

    .nav-button:hover {
      transform: translateY(-2px);
      background: var(--primary-dark);
    }

    .menu-button {
      display: none;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      cursor: pointer;
    }

    .menu-lines {
      display: grid;
      gap: 5px;
    }

    .menu-lines span {
      width: 22px;
      height: 2px;
      display: block;
      border-radius: 10px;
      background: var(--dark);
      transition: 0.25s ease;
    }

    .hero {
      position: relative;
      min-height: 745px;
      display: flex;
      align-items: center;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(5, 23, 44, 0.97) 0%,
          rgba(5, 23, 44, 0.88) 46%,
          rgba(5, 23, 44, 0.48) 100%
        ),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1900&q=88")
        center / cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 520px;
      height: 520px;
      left: -220px;
      bottom: -260px;
      border-radius: 50%;
      background: rgba(25, 120, 255, 0.22);
      filter: blur(2px);
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 420px;
      height: 420px;
      right: -150px;
      top: -190px;
      border-radius: 50%;
      background: rgba(10, 188, 174, 0.18);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(310px, 0.65fr);
      align-items: center;
      gap: 70px;
      padding: 105px 0 130px;
    }

    .hero-content {
      max-width: 760px;
      color: var(--white);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #d9e9ff;
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-badge span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #55dfa5;
      box-shadow: 0 0 0 6px rgba(85, 223, 165, 0.12);
    }

    .hero h1 {
      margin-bottom: 24px;
      font: 800 clamp(44px, 6vw, 78px) / 1.06 "Poppins", sans-serif;
      letter-spacing: -0.055em;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #87baff, #5ce0d2, #ffd86a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 680px;
      margin-bottom: 32px;
      color: #d6e2ef;
      font-size: 18px;
      line-height: 1.85;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 34px;
    }

    .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 24px;
      border: 0;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.28s ease;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .button-primary {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 18px 38px rgba(9, 87, 208, 0.34);
    }

    .button-primary:hover {
      background: #0a4fb9;
    }

    .button-light {
      background: var(--white);
      color: var(--dark);
      box-shadow: 0 15px 35px rgba(7, 26, 47, 0.13);
    }

    .button-outline {
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.07);
      color: var(--white);
      backdrop-filter: blur(10px);
    }

    .hero-trust {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      color: #cddbe9;
      font-size: 13px;
      font-weight: 700;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trust-check {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(87, 220, 161, 0.16);
      color: #63e2aa;
      font-size: 12px;
    }

    .hero-panel {
      position: relative;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(18px);
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -1;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .hero-panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .hero-panel-top span {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #11733d;
      background: #e7f9ee;
      font-size: 11px !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #23b95e;
    }

    .hero-panel h2 {
      margin-bottom: 10px;
      color: var(--dark);
      font: 800 26px / 1.25 "Poppins", sans-serif;
    }

    .hero-panel > p {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .guidance-list {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .guidance-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfdff;
    }

    .guidance-icon {
      flex: 0 0 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-light);
      font-size: 19px;
    }

    .guidance-item strong {
      display: block;
      color: var(--dark);
      font-size: 14px;
    }

    .guidance-item small {
      color: var(--muted);
      font-size: 12px;
    }

    .hero-panel .button {
      width: 100%;
    }

    .quick-stats {
      position: relative;
      z-index: 5;
      margin-top: -62px;
        .about-floating strong {
      display: block;
      color: var(--primary);
      font: 800 30px "Poppins", sans-serif;
      line-height: 1;
      margin-bottom: 6px;
    }

    .about-floating span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .about-content h2 {
      margin-bottom: 20px;
      color: var(--dark);
      font: 800 clamp(34px, 4vw, 54px) / 1.12 "Poppins", sans-serif;
      letter-spacing: -.04em;
    }

    .about-content p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 16px;
    }

    .feature-list {
      display: grid;
      gap: 18px;
      margin-top: 30px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .feature-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 24px;
    }

    .feature-item h4 {
      margin-bottom: 6px;
      color: var(--dark);
      font: 700 18px "Poppins", sans-serif;
    }

    .feature-item p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .cta-banner {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        var(--primary),
        #317eff
      );
      color: var(--white);
      padding: 70px;
    }

    .cta-banner::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      right: -120px;
      top: -120px;
      background: rgba(255,255,255,.12);
    }

    .cta-banner h2 {
      max-width: 700px;
      margin-bottom: 18px;
      font: 800 clamp(36px,4vw,56px) "Poppins",sans-serif;
    }

    .cta-banner p {
      max-width: 650px;
      margin-bottom: 30px;
      color: rgba(255,255,255,.92);
    }

    footer {
      padding: 70px 0 25px;
      background: var(--dark);
      color: #d4dfeb;
    }

    .footer-grid {
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1.3fr;
      gap:40px;
    }

    .footer-grid h4{
      color:white;
      margin-bottom:18px;
      font:700 18px "Poppins",sans-serif;
    }

    .footer-grid a{
      display:block;
      margin:10px 0;
      color:#d4dfeb;
      transition:.3s;
    }

    .footer-grid a:hover{
      color:white;
    }

    .footer-bottom{
      margin-top:50px;
      border-top:1px solid rgba(255,255,255,.1);
      padding-top:20px;
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:20px;
      font-size:14px;
    }

    .whatsapp{
      position:fixed;
      right:25px;
      bottom:25px;
      width:62px;
      height:62px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#25D366;
      color:white;
      font-size:26px;
      font-weight:800;
      box-shadow:0 15px 35px rgba(37,211,102,.35);
      z-index:999;
      transition:.3s;
    }

    .whatsapp:hover{
      transform:scale(1.08);
    }

    @media(max-width:1050px){

      .hero-grid,
      .about-grid{
        grid-template-columns:1fr;
      }

      .courses-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .service-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .stats-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .footer-grid{
        grid-template-columns:repeat(2,1fr);
      }

    }

    @media(max-width:768px){

      .menu-button{
        display:grid;
      }

      .nav-links{
        position:fixed;
        top:82px;
        left:15px;
        right:15px;
        display:none;
        flex-direction:column;
        background:white;
        border-radius:18px;
        padding:22px;
        box-shadow:var(--shadow-lg);
      }

      .nav-links.active{
        display:flex;
      }

      .hero{
        min-height:auto;
      }

      .hero-grid{
        padding:90px 0;
      }

      .hero h1{
        font-size:46px;
      }

      .courses-grid,
      .service-grid,
      .stats-grid,
      .footer-grid{
        grid-template-columns:1fr;
      }

      .about-floating{
        position:relative;
        right:auto;
        bottom:auto;
        width:100%;
        margin-top:20px;
      }

      .cta-banner{
        padding:40px 25px;
      }

    }
