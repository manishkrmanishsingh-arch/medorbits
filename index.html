      cursor: pointer;
      font-weight: 800;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(7, 86, 163, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-light {
      background: var(--white);
      color: var(--primary);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    }

    .nav-links {

      list-style: none;

      font-size: 0.94rem;

    }

    }

      height: 46px;

    }

      font-weight: 800;
