<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Apply for Services | MedOrbit</title>

  <meta
    name="description"
    content="Submit your details for education counselling, admission assistance, study abroad, private jobs, airport jobs, resume submission and employer hiring through MedOrbit."
  >

  <style>
    /* =========================================================
       MEDORBIT MULTI-FORM SYSTEM
       Responsive education and private-job forms
       ========================================================= */

    :root {
      --form-primary: #063f78;
      --form-primary-dark: #042d57;
      --form-accent: #0d79c7;
      --form-gold: #d7a72b;
      --form-success: #16803d;
      --form-danger: #c93535;
      --form-warning: #9b6700;
      --form-background: #f4f8fc;
      --form-card: #ffffff;
      --form-soft-blue: #eef6ff;
      --form-soft-gold: #fff9e8;
      --form-text: #182436;
      --form-muted: #647184;
      --form-border: #dbe4ed;
      --form-shadow: 0 18px 50px rgba(20, 54, 88, 0.09);
      --form-radius: 18px;
      --form-transition: 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--form-text);
      background: var(--form-background);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .medorbit-form-page {
      min-height: 100vh;
    }

    .form-page-container {
      width: min(1180px, calc(100% - 2rem));
      margin-inline: auto;
    }

    /* Header */

    .form-page-header {
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--form-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .form-header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .form-logo {
      color: var(--form-primary);
      font-family: "Times New Roman", Times, serif;
      font-size: 31px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .form-logo span {
      color: var(--form-gold);
    }

    .form-header-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .form-header-links a {
      color: #344359;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .form-header-links a:hover {
      color: var(--form-accent);
    }

    .form-contact-button {
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff !important;
      background: var(--form-primary);
      border-radius: 10px;
    }

    /* Hero */

    .form-page-hero {
      position: relative;
      padding: clamp(4rem, 8vw, 6.5rem) 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(215, 167, 43, 0.15),
          transparent 32%
        ),
        linear-gradient(
          125deg,
          var(--form-primary-dark),
          #086cae
        );
      color: #ffffff;
    }

    .form-page-hero::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -180px;
      top: -180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .form-hero-content {
      position: relative;
      z-index: 2;
      max-width: 850px;
    }

    .form-eyebrow {
      margin: 0 0 0.75rem;
      color: #ffd875;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .form-page-hero h1 {
      margin: 0 0 1rem;
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(2.5rem, 6vw, 4.6rem);
      line-height: 1.05;
      text-wrap: balance;
    }

    .form-page-hero p {
      max-width: 780px;
      margin: 0;
      color: #e5eff8;
      font-size: clamp(1rem, 2vw, 1.13rem);
      line-height: 1.75;
    }

    /* Main form area */

    .multi-form-section {
      padding: clamp(3rem, 7vw, 5.5rem) 0;
    }

    .multi-form-layout {
      display: grid;
      grid-template-columns: minmax(245px, 0.34fr) minmax(0, 1fr);
      gap: clamp(1.25rem, 3vw, 2rem);
      align-items: start;
    }

    /* Service selector */

    .form-service-panel {
      position: sticky;
      top: 96px;
      padding: 1.1rem;
      background: var(--form-card);
      border: 1px solid var(--form-border);
      border-radius: var(--form-radius);
      box-shadow: var(--form-shadow);
    }

    .form-service-panel h2 {
      margin: 0 0 0.35rem;
      color: var(--form-primary-dark);
      font-family: "Times New Roman", Times, serif;
      font-size: 1.65rem;
    }

    .form-service-panel > p {
      margin: 0 0 1rem;
      color: var(--form-muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    .form-service-list {
      display: grid;
      gap: 0.55rem;
    }

    .form-service-button {
      width: 100%;
      min-height: 50px;
      padding: 0.7rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #425168;
      background: #ffffff;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: left;
      transition:
        color var(--form-transition),
        background-color var(--form-transition),
        border-color var(--form-transition),
        transform var(--form-transition);
    }

    .form-service-button:hover {
      color: var(--form-primary);
      background: var(--form-soft-blue);
      transform: translateX(3px);
    }

    .form-service-button.active {
      color: #ffffff;
      background: var(--form-primary);
      border-color: var(--form-primary);
      box-shadow: 0 8px 20px rgba(6, 63, 120, 0.18);
    }

    .service-button-icon {
      width: 2rem;
      height: 2rem;
      flex: 0 0 2rem;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(6, 63, 120, 0.08);
      font-size: 1rem;
    }

    .form-service-button.active .service-button-icon {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Forms card */

    .form-display-panel {
      min-width: 0;
      padding: clamp(1.25rem, 4vw, 2.25rem);
      background: var(--form-card);
      border: 1px solid var(--form-border);
      border-radius: var(--form-radius);
      box-shadow: var(--form-shadow);
    }

    .dynamic-form {
      display: none;
      animation: formFadeIn 350ms ease both;
    }

    .dynamic-form.active {
      display: block;
    }

    @keyframes formFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-heading {
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--form-border);
    }

    .form-heading-label {
      margin: 0 0 0.45rem;
      color: var(--form-accent);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .form-heading h2 {
      margin: 0 0 0.5rem;
      color: var(--form-primary-dark);
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    .form-heading p {
      max-width: 760px;
      margin: 0;
      color: var(--form-muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    /* Form sections */

    .form-subsection {
      margin-bottom: 2rem;
    }

    .form-subsection:last-of-type {
      margin-bottom: 1.25rem;
    }

    .form-subsection-title {
      margin: 0 0 1rem;
      padding-left: 0.75rem;
      color: var(--form-primary-dark);
      border-left: 4px solid var(--form-gold);
      font-size: 1rem;
      font-weight: 900;
    }

    .advanced-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 1.15rem;
    }

    .advanced-form-group {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .advanced-form-group.form-full-width {
      grid-column: 1 / -1;
    }

    .advanced-form-group label,
    .form-choice-label {
      margin-bottom: 0.45rem;
      color: #344054;
      font-size: 0.83rem;
      font-weight: 800;
    }

    .form-required {
      color: var(--form-danger);
      margin-left: 0.2rem;
    }

    .advanced-form-group input,
    .advanced-form-group select,
    .advanced-form-group textarea {
      width: 100%;
      min-width: 0;
      min-height: 49px;
      padding: 0.75rem 0.85rem;
      color: #263449;
      background: #ffffff;
      border: 1px solid #d7e0e9;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.45;
      outline: none;
      transition:
        border-color var(--form-transition),
        box-shadow var(--form-transition),
        background-color var(--form-transition),
        transform var(--form-transition);
    }

    .advanced-form-group textarea {
      min-height: 125px;
      resize: vertical;
    }

    .advanced-form-group input::placeholder,
    .advanced-form-group textarea::placeholder {
      color: #929cac;
    }

    .advanced-form-group input:focus,
    .advanced-form-group select:focus,
    .advanced-form-group textarea:focus {
      border-color: var(--form-accent);
      box-shadow: 0 0 0 4px rgba(13, 121, 199, 0.11);
      transform: translateY(-1px);
    }

    .advanced-form-group input:invalid:not(:placeholder-shown),
    .advanced-form-group select:invalid:not(:focus) {
      border-color: #db6a6a;
    }

    .form-help-text {
      margin-top: 0.35rem;
      color: #7a8797;
      font-size: 0.74rem;
      line-height: 1.45;
    }

    /* Choices */

    .form-choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .form-choice-item {
      position: relative;
    }

    .form-choice-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .form-choice-item label {
      min-height: 48px;
      padding: 0.65rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #46566c;
      background: #ffffff;
      border: 1px solid var(--form-border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition:
        color var(--form-transition),
        background-color var(--form-transition),
        border-color var(--form-transition),
        transform var(--form-transition);
    }

    .form-choice-item label:hover {
      color: var(--form-primary);
      background: var(--form-soft-blue);
      border-color: #b7cde0;
      transform: translateY(-2px);
    }

    .form-choice-item input:checked + label {
      color: #ffffff;
      background: var(--form-primary);
      border-color: var(--form-primary);
      box-shadow: 0 6px 16px rgba(6, 63, 120, 0.17);
    }

    /* Upload */

    .advanced-file-upload {
      position: relative;
      padding: 1.4rem;
      border: 2px dashed #9fbed9;
      border-radius: 12px;
      background: #f5faff;
      text-align: center;
      transition:
        border-color var(--form-transition),
        background-color var(--form-transition),
        transform var(--form-transition);
    }

    .advanced-file-upload:hover,
    .advanced-file-upload.dragging {
      border-color: var(--form-primary);
      background: #eef7ff;
      transform: translateY(-2px);
    }

    .advanced-file-upload input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .advanced-file-icon {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 1.8rem;
    }

    .advanced-file-upload strong {
      display: block;
      color: var(--form-primary-dark);
      font-size: 0.9rem;
    }

    .advanced-file-upload span {
      color: var(--form-muted);
      font-size: 0.75rem;
    }

    .selected-file-name {
      margin-top: 0.5rem;
      color: var(--form-success);
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Consent */

    .advanced-form-consent {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin: 1.25rem 0;
      padding: 1rem;
      background: #f8fafc;
      border: 1px solid var(--form-border);
      border-radius: 10px;
    }

    .advanced-form-consent input {
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 1.05rem;
      margin-top: 0.2rem;
      accent-color: var(--form-primary);
    }

    .advanced-form-consent label {
      color: #59677a;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    /* Buttons */

    .advanced-form-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .advanced-submit-button,
    .advanced-reset-button {
      min-height: 50px;
      padding: 0.75rem 1.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 900;
      transition:
        transform var(--form-transition),
        background-color var(--form-transition),
        color var(--form-transition),
        border-color var(--form-transition),
        box-shadow var(--form-transition);
    }

    .advanced-submit-button {
      flex: 1;
      color: #ffffff;
      background: var(--form-primary);
      border: 1px solid var(--form-primary);
      box-shadow: 0 8px 20px rgba(6, 63, 120, 0.18);
    }

    .advanced-submit-button:hover {
      background: var(--form-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 11px 25px rgba(6, 63, 120, 0.23);
    }

    .advanced-reset-button {
      color: var(--form-primary);
      background: #ffffff;
      border: 1px solid #b7cadd;
    }

    .advanced-reset-button:hover {
      color: #ffffff;
      background: var(--form-primary);
      border-color: var(--form-primary);
    }

    .advanced-submit-button:active,
    .advanced-reset-button:active {
      transform: scale(0.98);
    }

    /* Messages */

    .advanced-form-message {
      display: none;
      margin-bottom: 1rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .advanced-form-message.success {
      display: block;
      color: var(--form-success);
      background: #ebf8ef;
      border: 1px solid #bee2c8;
    }

    .advanced-form-message.error {
      display: block;
      color: #a82222;
      background: #fff0f0;
      border: 1px solid #efc3c3;
    }

    /* Notice */

    .form-safety-notice {
      margin-top: 1.5rem;
      padding: 1rem;
      color: #6a5413;
      background: var(--form-soft-gold);
      border: 1px solid #ead996;
      border-radius: 11px;
      font-size: 0.77rem;
      line-height: 1.65;
    }

    .form-safety-notice strong {
      color: #4b3900;
    }

    /* Responsive */

    @media screen and (max-width: 960px) {
      .multi-form-layout {
        grid-template-columns: 1fr;
      }

      .form-service-panel {
        position: static;
      }

      .form-service-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-service-button:hover {
        transform: translateY(-2px);
      }
    }

    @media screen and (max-width: 720px) {
      .form-header-links a:not(.form-contact-button) {
        display: none;
      }

      .advanced-form-grid {
        grid-template-columns: 1fr;
      }

      .advanced-form-group.form-full-width {
        grid-column: auto;
      }

      .form-choice-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media screen and (max-width: 520px) {
      .form-page-container {
        width: min(100% - 1rem, 1180px);
      }

      .form-page-hero {
        padding: 3.5rem 0;
      }

      .form-display-panel,
      .form-service-panel {
        border-radius: 14px;
      }

      .form-service-list,
      .form-choice-grid {
        grid-template-columns: 1fr;
      }

      .advanced-form-actions {
        flex-direction: column;
      }

      .advanced-submit-button,
      .advanced-reset-button {
        width: 100%;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .form-service-button:hover,
      .form-choice-item label:hover,
      .advanced-submit-button:hover,
      .advanced-file-upload:hover {
        transform: none;
      }

      .advanced-submit-button,
      .advanced-reset-button {
        min-height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
